<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Engineering impact telemetry</title><desc id="desc">Animated metrics displaying shipped products, commits, contributions, and a personal deploy target.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#111019"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#64d2ff"/><stop offset=".52" stop-color="#2997ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .trace{stroke-dasharray:8 12;animation:trace 2s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.p2{animation-delay:-.6s}.p3{animation-delay:-1.2s}.p4{animation-delay:-1.8s}
      @keyframes trace{to{stroke-dashoffset:-40}}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="mono" font-size="13" fill="#64d2ff" letter-spacing="3">ENGINEERING / MEASURED</text>
  <text x="48" y="92" class="sans" font-size="24" font-weight="700" fill="#f5f5f7">Not progress bars. Built outcomes.</text>
  <path d="M80 153H1120" stroke="#303039" stroke-width="2"/><path class="trace" d="M80 153H1120" stroke="url(#line)" stroke-width="2"/>
  <g transform="translate(76 133)"><circle class="pulse" cx="0" cy="20" r="10" fill="#64d2ff" filter="url(#glow)"/><circle cx="0" cy="20" r="4" fill="#fff"/><text y="91" class="sans" font-size="50" font-weight="780" fill="#f5f5f7">03+</text><text y="121" class="mono" font-size="11" fill="#888892" letter-spacing="1.5">SHIPPED PRODUCTS</text><text y="145" class="sans" font-size="14" fill="#b4b4bc">Deployed and actively maintained</text></g>
  <g transform="translate(350 133)"><circle class="pulse p2" cx="0" cy="20" r="10" fill="#2997ff" filter="url(#glow)"/><circle cx="0" cy="20" r="4" fill="#fff"/><text y="91" class="sans" font-size="50" font-weight="780" fill="#f5f5f7">1000+</text><text y="121" class="mono" font-size="11" fill="#888892" letter-spacing="1.5">COMMITS PUSHED</text><text y="145" class="sans" font-size="14" fill="#b4b4bc">Mainline work, not noise</text></g>
  <g transform="translate(624 133)"><circle class="pulse p3" cx="0" cy="20" r="10" fill="#8f62ff" filter="url(#glow)"/><circle cx="0" cy="20" r="4" fill="#fff"/><text y="91" class="sans" font-size="50" font-weight="780" fill="#f5f5f7">PRs</text><text x="125" y="91" class="mono" font-size="15" fill="#8e8e98">+</text><text y="121" class="mono" font-size="11" fill="#888892" letter-spacing="1.5">MERGED COLLABORATION</text><text y="145" class="sans" font-size="14" fill="#b4b4bc">Reviews, fixes, and OSS feedback</text></g>
  <g transform="translate(928 133)"><circle class="pulse p4" cx="0" cy="20" r="10" fill="#bf5af2" filter="url(#glow)"/><circle cx="0" cy="20" r="4" fill="#fff"/><text y="91" class="sans" font-size="50" font-weight="780" fill="#f5f5f7">1</text><text x="120" y="91" class="mono" font-size="15" fill="#8e8e98">/YR</text><text y="121" class="mono" font-size="11" fill="#888892" letter-spacing="1.5">OS REBUILT BY HAND</text><text y="145" class="sans" font-size="14" fill="#b4b4bc">LFS — from scratch, on purpose</text></g>
  <rect x="48" y="306" width="1104" height="1" fill="url(#line)" opacity=".35"/>
  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
</svg>