    <text x="68" y="375" class="sans" font-size="15" fill="#a2a2ab">Local sellers meet smart commerce.</text><rect x="68" y="404" width="95" height="25" rx="12.5" fill="#64d2ff" fill-opacity=".1"/><text x="115" y="421" text-anchor="middle" class="mono" font-size="9" fill="#64d2ff">REACT + DJANGO</text><text x="358" y="421" text-anchor="end" class="mono" font-size="10" fill="#777782">01 →</text>
  </g><rect x="42" y="80" width="350" height="374" rx="25" fill="none" stroke="#fff" stroke-opacity=".1"/>

