    <circle cx="983" cy="172" r="24" fill="#18121f" stroke="#bf5af2"/><text x="983" y="168" text-anchor="middle" class="mono" font-size="8" fill="#e09aff">BIKRAM</text><text x="983" y="180" text-anchor="middle" class="mono" font-size="8" fill="#e09aff">GOLE</text>
    <g><circle class="pulse" cx="886" cy="133" r="17" fill="#bf5af2" fill-opacity=".22"/><circle cx="886" cy="133" r="9" fill="#19131e" stroke="#bf5af2"/><text x="886" y="136" text-anchor="middle" class="mono" font-size="7" fill="#e09aff">THEME</text></g>
    <g><circle class="pulse p2" cx="1078" cy="127" r="17" fill="#ff9f0a" fill-opacity=".18"/><circle cx="1078" cy="127" r="9" fill="#19131e" stroke="#ff9f0a"/><text x="1078" y="130" text-anchor="middle" class="mono" font-size="7" fill="#ffc05c">TERM</text></g>
    <g><circle class="pulse p3" cx="1084" cy="222" r="17" fill="#ff375f" fill-opacity=".18"/><circle cx="1084" cy="222" r="9" fill="#19131e" stroke="#ff375f"/><text x="1084" y="225" text-anchor="middle" class="mono" font-size="7" fill="#ff7992">QUIZ</text></g>
    <g><circle class="pulse p4" cx="884" cy="220" r="17" fill="#af52de" fill-opacity=".18"/><circle cx="884" cy="220" r="9" fill="#19131e" stroke="#af52de"/><text x="884" y="223" text-anchor="middle" class="mono" font-size="7" fill="#d88cf3">DARK</text></g>
