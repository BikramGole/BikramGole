<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Selected engineering projects</title><desc id="desc">Animated product cards for KinaHub, Android 17 Cinnamon Bun, and BikramGole.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06070a"/><stop offset="1" stop-color="#111019"/></linearGradient>
    <linearGradient id="g1" x1="0" x2="1"><stop stop-color="#64d2ff"/><stop offset="1" stop-color="#2997ff"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop stop-color="#2997ff"/><stop offset="1" stop-color="#30d158"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop stop-color="#bf5af2"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2997ff" stop-opacity=".22"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c1"><rect x="42" y="80" width="350" height="374" rx="25"/></clipPath><clipPath id="c2"><rect x="425" y="80" width="350" height="374" rx="25"/></clipPath><clipPath id="c3"><rect x="808" y="80" width="350" height="374" rx="25"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .chart{stroke-dasharray:390;stroke-dashoffset:390;animation:draw 4s ease-in-out infinite}.flow{stroke-dasharray:5 9;animation:flow 1.5s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}.p2{animation-delay:-.8s}.p3{animation-delay:-1.6s}.p4{animation-delay:-2.2s}
      .packet{animation:packet 3.5s linear infinite}.packet2{animation:packet2 3.2s linear infinite}.ring{transform-box:view-box;transform-origin:983px 172px;animation:spin 8s linear infinite}.scan{animation:scan 4s linear infinite}
      @keyframes draw{45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-390}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{50%{opacity:.28;transform:scale(1.3)}}@keyframes packet{from{transform:translateX(0)}to{transform:translateX(212px)}}@keyframes packet2{from{transform:translateY(0)}to{transform:translateY(94px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{from{transform:translateX(-360px)}to{transform:translateX(420px)}}
    </style>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="46" y="48" class="mono" font-size="13" fill="#64d2ff" letter-spacing="3">SELECTED SYSTEMS / BUILT TO MOVE</text>
  <text x="1122" y="48" text-anchor="end" class="mono" font-size="11" fill="#777782">03 SHIPPED BUILDS</text>

