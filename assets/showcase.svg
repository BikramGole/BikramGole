    <rect x="425" y="80" width="350" height="374" rx="25" fill="#15151b"/><rect x="425" y="80" width="350" height="190" fill="#0c1215"/>
    <g opacity=".26"><path d="M477 132H721M477 218H721M512 109V242M600 109V242M688 109V242" stroke="#667078" stroke-width="1"/></g>
