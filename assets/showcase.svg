    <text x="834" y="375" class="sans" font-size="15" fill="#a2a2ab">Theme engine, terminal, persona quiz.</text><rect x="834" y="404" width="112" height="25" rx="12.5" fill="#bf5af2" fill-opacity=".1"/><text x="890" y="421" text-anchor="middle" class="mono" font-size="9" fill="#db89ff">AURA INTERACTIVE</text><text x="1124" y="421" text-anchor="end" class="mono" font-size="10" fill="#777782">03 →</text>
