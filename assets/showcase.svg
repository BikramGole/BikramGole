    <circle cx="600" cy="122" r="14" fill="#111820" stroke="#30d158"/><text x="600" y="126" text-anchor="middle" class="mono" font-size="8" fill="#74e598">3D</text>
    <circle cx="600" cy="228" r="14" fill="#111820" stroke="#2997ff"/><text x="600" y="232" text-anchor="middle" class="mono" font-size="8" fill="#64d2ff">SIM</text>
    <circle cx="721" cy="175" r="14" fill="#111820" stroke="#30d158"/><text x="721" y="179" text-anchor="middle" class="mono" font-size="8" fill="#74e598">REDUX</text>
    <circle class="packet" cx="490" cy="175" r="4" fill="#64d2ff" filter="url(#glow)"/><circle class="packet2" cx="600" cy="128" r="4" fill="#30d158" filter="url(#glow)"/>
    <text x="451" y="303" class="mono" font-size="11" fill="#49c9a0" letter-spacing="1.5">CINEMATIC ANDROID SHOWCASE</text><text x="449" y="342" class="sans" font-size="28" font-weight="740" fill="#f5f5f7">Android 17</text>
    <text x="451" y="375" class="sans" font-size="15" fill="#a2a2ab">Cinnamon Bun — API 37, in 3D.</text><rect x="451" y="404" width="106" height="25" rx="12.5" fill="#30d158" fill-opacity=".1"/><text x="504" y="421" text-anchor="middle" class="mono" font-size="9" fill="#61da89">THREE.JS + REACT</text><text x="741" y="421" text-anchor="end" class="mono" font-size="10" fill="#777782">02 →</text>
  </g><rect x="425" y="80" width="350" height="374" rx="25" fill="none" stroke="#fff" stroke-opacity=".1"/>

