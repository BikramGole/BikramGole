<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">From bare metal to shipped products</title>
  <desc id="desc">An animated architecture diagram showing data flowing through build, power, and deliver stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#09090b"/><stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#64d2ff"/><stop offset=".5" stop-color="#2997ff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#2997ff" stop-opacity=".25"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#4d4d55"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .flow{stroke-dasharray:8 14;animation:dash 2.2s linear infinite}
      .live{animation:live 2.4s ease-in-out infinite}
      .card{transform-box:fill-box;animation:float 5s ease-in-out infinite}.c2{animation-delay:-1.6s}.c3{animation-delay:-3.2s}
      @keyframes dash{to{stroke-dashoffset:-44}}
      @keyframes live{50%{opacity:.3}}
      @keyframes float{50%{transform:translateY(-6px)}}
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="260" fill="url(#halo)"/>
  <text x="60" y="66" class="sans" font-size="16" font-weight="700" fill="#64d2ff" letter-spacing="2.5">HOW I BUILD</text>
  <text x="60" y="113" class="sans" font-size="38" font-weight="700" fill="#f5f5f7" letter-spacing="-1.5">From bare metal to shipped products.</text>
  <text x="60" y="148" class="sans" font-size="18" fill="#8e8e93">One observable path. Every layer understood from source.</text>
  <path d="M330 278H458" stroke="#4d4d55" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M742 278H870" stroke="#4d4d55" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" d="M330 278H458" stroke="#64d2ff" stroke-width="2"/>
  <path class="flow" d="M742 278H870" stroke="#bf5af2" stroke-width="2"/>
  <g class="card">
    <rect x="58" y="205" width="272" height="150" rx="22" fill="#17171c" stroke="#fff" stroke-opacity=".11"/>
    <circle cx="94" cy="243" r="10" fill="#64d2ff" opacity=".18"/>
    <circle class="live" cx="94" cy="243" r="4" fill="#64d2ff" filter="url(#glow)"/>
    <text x="118" y="250" class="mono" font-size="13" fill="#8e8e93" letter-spacing="1">01 / BUILD</text>
    <text x="86" y="299" class="sans" font-size="25" font-weight="700" fill="#f5f5f7">From source</text>
    <text x="86" y="329" class="sans" font-size="15" fill="#8e8e93">LFS · custom · compiled</text>
  </g>
  <g class="card c2">
    <rect x="464" y="205" width="272" height="150" rx="22" fill="#17171c" stroke="url(#accent)" stroke-opacity=".7"/>
    <circle cx="500" cy="243" r="10" fill="#2997ff" opacity=".18"/>
    <circle class="live" cx="500" cy="243" r="4" fill="#2997ff" filter="url(#glow)"/>
    <text x="524" y="250" class="mono" font-size="13" fill="#8e8e93" letter-spacing="1">02 / POWER</text>
    <text x="492" y="299" class="sans" font-size="25" font-weight="700" fill="#f5f5f7">CLI + AI glue</text>
    <text x="492" y="329" class="sans" font-size="15" fill="#8e8e93">C++ · Python · Bash utilities</text>
  </g>
  <g class="card c3">
    <rect x="870" y="205" width="272" height="150" rx="22" fill="#17171c" stroke="#fff" stroke-opacity=".11"/>
    <circle cx="906" cy="243" r="10" fill="#bf5af2" opacity=".18"/>
    <circle class="live" cx="906" cy="243" r="4" fill="#bf5af2" filter="url(#glow)"/>
    <text x="930" y="250" class="mono" font-size="13" fill="#8e8e93" letter-spacing="1">03 / DELIVER</text>
    <text x="898" y="299" class="sans" font-size="25" font-weight="700" fill="#f5f5f7">Deployed products</text>
    <text x="898" y="329" class="sans" font-size="15" fill="#8e8e93">web · commerce · AI workflows</text>
  </g>
  <g transform="translate(60 398)">
    <circle cx="5" cy="0" r="5" fill="#30d158"/>
    <text x="20" y="5" class="mono" font-size="13" fill="#8e8e93">SYSTEM HEALTHY</text>
    <text x="190" y="5" class="mono" font-size="13" fill="#8e8e93">OS / LFS</text>
    <text x="350" y="5" class="mono" font-size="13" fill="#8e8e93">WM / DWL</text>
    <text x="470" y="5" class="mono" font-size="13" fill="#8e8e93">EDITOR / NEOVIM</text>
    <text x="700" y="5" class="mono" font-size="13" fill="#8e8e93">TARGET / SMALL + FAST + FREE</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="438.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>